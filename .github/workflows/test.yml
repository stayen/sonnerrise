name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testroot
          MYSQL_DATABASE: sonnerrise_test
          MYSQL_USER: sonnerrise
          MYSQL_PASSWORD: testpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -e packages/sonnerrise-core
          pip install -e packages/sonnerrise-personas
          pip install -e packages/sonnerrise-definitions
          pip install -e packages/sonnerrise-tracks
          pip install -e packages/sonnerrise-promo
          pip install -e packages/sonnerrise-calendar
          pip install -e packages/sonnerrise-tools
          pip install -e packages/sonnerrise-web

- name: Run tests
        env:
          SONNERRISE_DB_HOST: 127.0.0.1
          SONNERRISE_DB_PORT: 3306
          SONNERRISE_DB_USER: sonnerrise
          SONNERRISE_DB_PASSWORD: testpassword
          SONNERRISE_DB_NAME: sonnerrise_test
        run: |
          coverage_args=""
          for pkg in packages/sonnerrise-*/; do
            echo "=== Testing $pkg ==="
            pytest "$pkg" -v --cov --cov-append
          done
          coverage xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
        continue-on-error: true
