[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sonnerrise-personas"
version = "0.1.0"
description = "Personas module for Sonnerrise - Suno persona definitions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "sonnerrise-core>=0.1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
sonnerrise-personas = "sonnerrise_personas.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sonnerrise_personas"]
