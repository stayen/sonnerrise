[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sonnerrise-definitions"
version = "0.1.0"
description = "Definitions module for Sonnerrise - Suno track generation definitions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "sonnerrise-core>=0.1.0",
    "sonnerrise-personas>=0.1.0",
    "pydantic>=2.0",
]
authors = [
    { name = "Konstantin Boyandin", email = "developer@boyandin.com" }
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
sonnerrise-definitions = "sonnerrise_definitions.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sonnerrise_definitions"]
