[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sonnerrise-promo"
version = "0.1.0"
description = "Promotion module for Sonnerrise - track promotion management"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "sonnerrise-core>=0.1.0",
    "sonnerrise-tracks>=0.1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
sonnerrise-promo = "sonnerrise_promo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sonnerrise_promo"]
