[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sonnerrise-tracks"
version = "0.1.0"
description = "Tracks module for Sonnerrise - Suno track management"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "sonnerrise-core>=0.1.0",
    "sonnerrise-definitions>=0.1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
sonnerrise-tracks = "sonnerrise_tracks.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sonnerrise_tracks"]
