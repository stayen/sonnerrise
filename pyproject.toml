[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sonnerrise"
version = "0.1.0"
description = "Suno track management and promotion planning suite"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []
authors = [
    { name = "Konstantin Boyandin", email = "developer@boyandin.com" }
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.12",
    "mypy>=1.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["packages"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.bumpversion]
current_version = "0.1.0"
